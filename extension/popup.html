<html>
    <head>
        <title>Freshdesk History Cleaner</title>
        <link rel="stylesheet" href="popup.css">
    </head>
    <body>
        <h1>Freshdesk History Cleaner</h1>
        <div class="setting">
            <label for="skip-first-message">
                <strong>Skip first message</strong>
                <small>Leave the first message unchanged.</small>
            </label>
            <input id="skip-first-message" type="checkbox">
        </div>
        <div class="setting">
            <label for="default-auto-clean">
                <strong>Default auto clean</strong>
                <small>Clean tickets automatically when they open.</small>
            </label>
            <input id="default-auto-clean" type="checkbox">
        </div>
        <script src="popup.js"></script>
    </body>
</html>
